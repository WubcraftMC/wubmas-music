# WubmasMusic: plays the DJ sets live from the resource pack.
# The pack tool (make_music_packs.py) writes a ready config.yml with `pieces` and `seconds` filled in for the sets you gave it:
# copy that file over this one, or copy its `sets:` list into here. A set with `pieces: 0` has no audio yet and never plays.
# After editing: /wubmusic reload

timezone: America/Los_Angeles      # the times below are read in this time zone

# How the sets were cut. These must match what the pack tool used (its defaults are these numbers).
piece-seconds: 15                  # length of one piece; a multiple of 0.05
overlap-seconds: 0.3               # how much two pieces overlap at a join
late-limit-ms: 500                 # a piece that is more than this late (the server stalled) is skipped, not played out of step

sound:
  source: record                   # which volume slider it follows: record (jukebox), music, master, ambient, player ...
  volume: 1.0                      # only used when the music is the same volume everywhere (no stage point, or fade: false); with a stage point Java players' sliders do the rest
  pitch: 1.0
  # Walk away from the stage and the music fades out, come closer and it gets louder. For that the plugin needs to know where the speakers are:
  # stand there in game and run /wubmusic stage set [radius]  (kept in stage.yml). The radius is how far away it can still be heard (default 64): silent beyond it, half as loud halfway.
  # On Java the player's own game does the fading, so it costs the server nothing. false = the same volume everywhere, as before.
  fade: true
  # A piece cannot be started in the middle, so a player who comes back (from another world, into the festival area, /music on, once their pack has loaded) would wait for the next one, up to a whole piece.
  # If the next piece is more than this many seconds away they get the piece that is playing at once, from its start: behind the others by the time into the piece, and the next piece puts them on the live position.
  # 0 = never wait; a whole piece or more = always wait for the next piece. Not set (the default): a quarter of a piece, at most 3 seconds, so it follows the piece length of the music build by itself
  # (15 s pieces: 3 seconds, 6 s pieces: 1.5 seconds). Remove the # below to set it yourself.
  # max-wait-seconds: 3

# The Java resource pack. The plugin hands it to Java players a moment AFTER they have joined: they are in the world straight away and the game downloads it in the background
# (it saves it, so it is a one-time download until the pack changes). Leave resource-pack= and resource-pack-sha1= EMPTY in server.properties, or they get it in the join screen too.
# Bedrock players get their pack from Geyser (plugins/Geyser-Spigot/packs) when they join and are not affected by this.
# New pack: put its download link and its SHA-1 here (the pack tool prints both), then /wubmusic reload. It is used for the next player who joins.
# An empty url = the plugin sends no pack.
resource-pack:
  url: "https://github.com/WubcraftMC/wubmas-music/releases/download/1.0.4/WubmasMusic-java-build9.zip"
  sha1: "c95306c8633156a54fe101dafc25c5acab551d44"
  delay-seconds: 2                 # how long after joining the pack is offered
  prompt: "Wubmas music: a one-time download, then your game keeps it."     # on the screen that asks to allow it; "" for no text
  # How the Java pack holds each piece: "stereo" = one stereo sound (Minecraft plays a stereo sound at the player's ears, so it is the same volume
  # everywhere and the stage fade does nothing for Java players); "split" = the left and the right channel as two sounds, played from a left and a
  # right speaker at the stage (/wubmusic stage set), so the music gets quieter as a player walks away and the stereo stays.
  # The music builder writes "split" into library.yml and /wubmusic update switches to it; set it here only for a pack you made yourself.
  layout: stereo

# Music from GitHub. The music builder (the wubmas-music repository on GitHub) turns the DJ files into the packs and a file called library.yml.
# /wubmusic update downloads that file (and the Bedrock pack), checks them and switches the server to the new music: the sets and the Java pack in library.yml then
# replace the ones in this file. Nothing is downloaded until you run the command. url is the link the builder's run summary shows (https only); "" = update is off.
library:
  url: "https://github.com/WubcraftMC/wubmas-music/releases/latest/download/library.yml"
  bedrock: true                    # also put the Bedrock pack into Geyser's packs folder (Bedrock players get it after the next server restart); false if you have no Bedrock players
  geyser-folder: "Geyser-Spigot"   # the folder in plugins/ that Geyser uses

# To limit the music to the festival instead of a whole world: stand in the middle of it, in game, and run /wubmusic area set <radius>. (Kept in area.yml, not here.)
worlds: []                         # empty = everybody online hears it; or list world names, e.g. [world, stage]

# Inside the festival area (above), cushions cannot be punched, shot or blown up by anyone without the wubmasmusic.admin permission. Does nothing until an area is set.
protect-cushions: true

bossbar:
  enabled: true                    # the purple bar with the DJ's name and how far through the set it is
  title: "Now playing: {name}"

# /wubmusic start <set> [seconds] counts down on the screen of everyone who would hear the music (not for players with /music off, in another world or outside the festival area):
# the time left above the hotbar, then the last title-seconds seconds as a big number in the middle of the screen, then the set's name and "Now playing" when the music starts.
# {name} is the DJ's name, {time} the time left (1:30, or 45 s). "" for any text = that part is not shown.
countdown:
  enabled: true                    # false = no countdown at all
  title-seconds: 5                 # how many of the last seconds are a big number; 0 = no big numbers, only the line above the hotbar
  actionbar-text: "{name} starts in {time}"     # above the hotbar until the big numbers start
  subtitle: "{name}"               # under the big number
  go-title: "{name}"               # in the middle of the screen when the music starts
  go-subtitle: "Now playing"

# The CDJs on the DJ table show what is playing: a song's title and its artist, or the DJ's name, and when nothing plays the festival's name and when the next set is.
# They place themselves: once the stage point is set (/wubmusic stage set; or, with no stage point, the festival area) every CDJ within 40 blocks of it gets a screen, a minute at the
# latest after the CDJs are there (the plugin looks when a set starts or ends and once a minute, never more often). They are text displays lying on top of the CDJs; the plugin only rewrites
# their text when a set starts or ends (nothing runs in between), so they cost the server nothing. A table further away: stand at it and run /wubmusic screens place.
# Text the wrong way round? /wubmusic screens turn. /wubmusic screens remove takes them away (with auto on they come back within a minute: set auto to false to stop that).
# Changed scale, width or background here? /wubmusic reload, then /wubmusic screens place at the table (it replaces the old ones).
screens:
  enabled: true                    # false = the plugin never writes to them, and place does nothing
  auto: true                       # put a screen on every CDJ near the stage point (or the festival area's middle) by itself; false = only /wubmusic screens place does
  scale: 0.2                       # size of the text (1 = like a name tag); 0.05 to 2
  width: 100                       # how wide a line can get before it wraps, in text pixels; 20 to 400
  max-chars: 16                    # a longer line is cut and ends in ...; 4 to 60
  background: "C00A0A12"           # the colour behind the text: 8 hex digits, alpha red green blue (C0 is mostly solid); keep the quotes
  subtitle: "Wubmas 2026"          # the small line under a DJ's name ("" = none); a test song shows its artist there instead
  idle: "WUBMAS"                   # the big line when nothing plays
  next-hours: 12                   # when nothing plays, the small line says when the next set starts if that is within this many hours; 0 = never

# The stage lights follow the music. The builder (lightmap.py) finds the beats, bars, breaks and drops in each set's audio when it builds the music; the plugin then runs the commands
# below at those moments, on the same clock as the music (Java and Bedrock alike). It costs the server nothing while no set plays. Needs a build that has a light map: /wubmusic update
# fetches it (plugins/WubmasMusic/lights.txt). Try it without a set: /wubmusic lights test. On/off and "lights look early/late": /wubmusic lights on|off|later|earlier|offset <ms>; the pulse on the kick: /wubmusic lights pulse on|off.
# A cue is a list of console commands, without the slash (the ones here drive ControlRoom, which drives StageLights). {color} is the next colour of palette, {effect} the next movement of
# effects, {current} the colour the last bar set. "+4 command" runs the command 4 seconds after the cue. A cue with no commands does nothing. Cues: start (a set starts), beat (the pulse
# on the kick: every strong beat flashes the lights white for 0.2 seconds, then back to their colour. Left empty it is that built-in pulse; commands of your own replace it; a command per
# beat is work for the lights, so keep it to one or two), bar (the first beat of a bar, about every 2 s: the colour changes), phrase (every 8 bars: the movement changes),
# drop (the kick comes back after a break), break (the kick stops for 8 beats or more), end (the set is over).
# Safety first: the default cues never use the fast strobe (more than 3 flashes a second can trigger seizures), and the limits below keep any setting from flashing the lights faster
# than 3 flashes a second (the pulse is at most 2.5 a second). Do not raise them without a good reason.
lights:
  enabled: true                    # false = no lights from the music (/wubmusic lights on|off does the same and is remembered in lights.yml)
  pulse: true                      # false = no pulse on the kick (/wubmusic lights pulse on|off does the same and is remembered in lights.yml)
  offset-ms: 0                     # lights later (+) or earlier (-) than the music, -1000 to 1000
  max-late-ms: 150                 # a beat, bar or phrase cue that is later than this (the server stalled) is dropped, not played out of step; a break or a drop may be 4 times as late
  max-commands-per-tick: 1         # at most this many commands in one tick; the rest go out in the next ticks. 1 spreads the work over several ticks, so a cue never puts all its commands into one (each command redraws every light)
  beat-min-level: 2                # the beat cue is for beats of this level or more (1 soft, 2 normal, 3 hard)
  bar-min-level: 1                 # the bar cue is for bars with a kick of this level or more (0 = also bars where the kick is out, in a break)
  beat-seconds: 0.4                # the shortest time between two beat cues
  bar-seconds: 1.4                 # between two bar cues (so a fast track changes colour every second bar, not every bar)
  phrase-seconds: 4
  drop-seconds: 10
  break-seconds: 10
  max-cues-per-second: 6           # beat, bar and phrase cues together; 1 to 20 (the gaps above keep it near 3.5)
  min-tps: 17                      # the lights pause while the server runs slower than this many ticks a second, so they never add work to a server that is behind; 0 = never
  palette: [red, magenta, purple, blue, cyan, light_blue, lime, orange]
  effects: [sweep, wave, fan, circle, figure8, diamond]
  cues:
    start:
      - controlroom test light all on
      - controlroom test light all strobe/off
    beat: []                        # empty = the built-in pulse: white for 0.2 seconds on a strong beat, then back to the bar's colour
    bar:
      - controlroom test light all color/{color}
    phrase:
      - controlroom test light all effect/{effect}
    drop:
      - controlroom test light all color/white
      - controlroom test light all strobe/heartbeat     # 1.7 flashes a second: under the limit of 3
      - +4 controlroom test light all strobe/off
    break:
      - controlroom test light all strobe/off
      - controlroom test light all color/blue
      - controlroom test light all effect/static
    end:
      - controlroom test light all strobe/off

messages:
  join: "{name} is on. The music joins in about {wait} seconds. /music off to mute it."     # sent to people who join during a set (to Java players once the pack has loaded); "" to turn off
  join-now: "{name} is on, the music starts now. /music off to mute it."     # the same, when the music starts for them at once (see sound.max-wait-seconds); "" to turn off
  pack-failed: "The Wubmas music pack did not load, so you will not hear the music. Type /music pack to try again (and allow server resource packs for this server if you turned them off)."     # "" to turn off

# The lineup. start is in quotes, local time in the time zone above. id = the file name you give the pack tool.
sets:
  - {id: dxbuddha,      name: "DxBuddha",             start: "2026-12-19 14:00", pieces: 0}
  - {id: yungsiete,     name: "Yung Siete",           start: "2026-12-19 14:30", pieces: 0}
  - {id: gnarlie,       name: "Gnarlie",              start: "2026-12-19 15:15", pieces: 0}
  - {id: frgmntd,       name: "FRGMNTD",              start: "2026-12-19 15:45", pieces: 0}
  - {id: voydoom_moros, name: "Voydoom B2B Moros",    start: "2026-12-19 16:30", pieces: 0}
  - {id: infrno,        name: "INFRNO",               start: "2026-12-19 17:00", pieces: 0}
  - {id: jamesv,        name: "James V",              start: "2026-12-19 17:30", pieces: 0}
